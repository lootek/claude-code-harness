# providers.yaml — read by tools/cc.py (co-located). Install next to the
# script (e.g. ~/.claude/tools/providers.yaml); cc.py falls back to
# ~/.claude/providers.yaml if not found here.
#
# max_output_tokens: empty by default → claude code applies its per-model
#   default (the CLI clamps explicit values anyway). Set to an int — e.g. for
#   a local model with no CLI per-model table entry — and the wrapper exports
#   CLAUDE_CODE_MAX_OUTPUT_TOKENS=<value>. Empty/absent → the env var stays
#   unset.
#
# auth_token: a literal (e.g. ollama) OR a path to a file holding only the
#   token (e.g. ~/.secrets/openrouter). Paths start with ~ or /. The wrapper
#   reads the file and strips whitespace, and exits with a clear message
#   instead of a traceback if the file is missing.
#
# api_key: optional. Most gateways authenticate off ANTHROPIC_AUTH_TOKEN alone
#   and want ANTHROPIC_API_KEY empty (the default). Set to "auth_token" to reuse
#   the resolved auth_token, or give it its own literal/path/env: spec. The HF
#   router documents setting both.
#
# route_slots_to_model: optional bool. claude code fills internal slots
#   (ANTHROPIC_DEFAULT_{OPUS,SONNET,HAIKU}_MODEL, CLAUDE_CODE_SUBAGENT_MODEL)
#   with Anthropic model names that do not resolve on a BYO provider. Set true
#   to point every slot at whatever model you picked — right when the catalogue
#   is large and no single model is the obvious default. Pin them explicitly in
#   `env:` instead when one model should always serve a slot (z.ai does this);
#   explicit `env:` entries always win.
#
# env: optional map of extra env vars the wrapper exports for that provider
#   (BYO providers like z.ai that need ANTHROPIC_DEFAULT_*_MODEL for claude
#   code's background haiku calls, API_TIMEOUT_MS, etc.). Values are literal
#   strings — a leading ~ or / is NOT treated as a file path here (only
#   auth_token does that). Exported after the ANTHROPIC_* clear, so keys
#   starting with ANTHROPIC_ are safe.

providers:
  anthropic:
    native: true
    max_output_tokens:
    # Three sources, in order, each falling through to the next:
    #
    # 1. ~/.secrets/anthropic — if present, an explicit ask to hit the live
    #    API instead of anything cached locally.
    #
    # 2. ~/.claude/cache/model-catalog/ — the claude code binary's own model
    #    catalogue, populated by `claude`/`/login` itself (signed, versioned,
    #    fetchedAt/staleAt). published-floor.json maps the current content
    #    hash to the live published-<hash>.json; the picker reads
    #    .document.surfaces.cc.model_selector_config[0].models[].id. This is
    #    what caught claude-opus-5-5 missing from the old hardcoded list below
    #    (added 2026-09) — prefer it, it can't go stale the way a hand
    #    maintained list can. Internal/undocumented format: no public schema
    #    promise, may change on a claude code update, and does not exist until
    #    `claude` has run once.
    #
    # 3. Hardcoded fallback — pre-login, or if the cache format ever breaks.
    #    Refreshed Sept 2026. [1m] variants only for the suffix-capable 200k
    #    models per the claude code 2.1.212 context table (append [1m] to
    #    unlock 1M; claude code strips it before the API call). Native-1M
    #    models (fable-5, fable-5-1, opus-5, opus-5-5) get no suffix variant —
    #    confirmed for opus-5-5: it does not honor [1m], consistent with the
    #    catalog listing it at max_input_tokens=1000000 with no separate
    #    suffix gate. NOTE: the same catalog now also shows opus-4-{8,7,6}
    #    and sonnet-4-6 at max_input_tokens=1000000 (source #2, live), which
    #    would mean the suffix these once needed is no longer required —
    #    unverified against sources #1/#3, so the fallback below still emits
    #    it rather than guess. claude-haiku-4-5-20251001 stays 200k only.
    listcmd: |
      if [[ -f ~/.secrets/anthropic ]]; then
        curl -s https://api.anthropic.com/v1/models \
          -H "anthropic-version: 2023-06-01" \
          -H "x-api-key: $(cat ~/.secrets/anthropic)" \
        | jq -r '.data[].id' 2>/dev/null
      elif cat=~/.claude/cache/model-catalog; \
           hash=$(jq -r '.sources | keys[0] // empty' "$cat/published-floor.json" 2>/dev/null); \
           [[ -n "$hash" && -f "$cat/published-$hash.json" ]] && \
           ids=$(jq -r '.document.surfaces.cc.model_selector_config[0].models[]?.id' \
                   "$cat/published-$hash.json" 2>/dev/null) && \
           [[ -n "$ids" ]]; then
        printf '%s\n' "$ids"
      else
        for m in \
          claude-fable-5-1 \
          claude-fable-5 \
          claude-opus-5-5 \
          claude-opus-5 \
          claude-opus-4-8 \
          claude-opus-4-7 \
          claude-opus-4-6 \
          claude-sonnet-5 \
          claude-sonnet-4-6 \
          claude-haiku-4-5-20251001
        do
          printf '%s\n' "$m"
          case "$m" in
            claude-opus-4-*|claude-sonnet-4-*) printf '%s[1m]\n' "$m" ;;
          esac
        done
      fi

  ollama:
    base_url: http://localhost:11434
    auth_token: ollama
    max_output_tokens:
    # claude code 2.1.212 honors the [1m] suffix for ANY provider, not just
    # api.anthropic.com — NPc()'s first branch is ub(e)=/\[1m\]/i.test(model),
    # ungated by firstParty. The suffix grants a 1M context window and is
    # stripped (oi()->Bs()) before the ollama API call, so the backend sees
    # the plain runnable name. Issue #46416 was closed NOT_PLANNED but the
    # suffix path works regardless in 2.1.212+.
    # Cloud models run as <name>:cloud. ollama.com/api/tags now returns non-zero
    # size for cloud entries too, so the old size==0 heuristic emitted broken
    # plain names (e.g. `kimi-k3` → "model not found"); append :cloud to every
    # catalogue entry instead. Local `ollama list` already gives correct names.
    # 1M-capable cloud models get a [1m] variant (glm-5.2: 1,000,000;
    # kimi-k3: 1,048,576 — both confirmed via ollama /api/show).
    listcmd: |
      {
        ollama list 2>/dev/null | awk 'NR>1 {print $1}'
        curl -s https://ollama.com/api/tags 2>/dev/null \
          | jq -r '.models[].name' 2>/dev/null \
          | sed 's/$/:cloud/'
      } | sort -u | awk '
        { print }
        /^(glm-5\.2|kimi-k3):cloud$/ { print $0 "[1m]" }
      '

  openrouter:
    base_url: https://openrouter.ai/api
    auth_token: ~/.secrets/openrouter
    max_output_tokens:
    listcmd: 'curl -s https://openrouter.ai/api/v1/models | jq -r ".data[].id" | grep -i anthropic'

  poe:
    base_url: https://api.poe.com
    auth_token: ~/.secrets/poe
    max_output_tokens:
    listcmd: 'curl -s https://api.poe.com/v1/models | jq -r ".data[].id" | grep -iE "claude-(opus|sonnet|haiku)"'

  zai:
    # Z.AI (Zhipu) — Anthropic-compatible endpoint, Bearer auth.
    # https://docs.z.ai/devpack/tool/claude  (api key in ~/.secrets/z.ai)
    # The [1m] suffix works for any provider in claude code 2.1.212+ (see ollama
    # note above); glm-5.2[1m] is confirmed 1M by z.ai's own config guide.
    base_url: https://api.z.ai/api/anthropic
    auth_token: ~/.secrets/z.ai
    max_output_tokens:
    env:
      # Route claude code's internal background slots (title gen, etc.) to
      # z.ai instead of api.anthropic.com (which has no key here).
      ANTHROPIC_DEFAULT_HAIKU_MODEL: glm-4.7
      ANTHROPIC_DEFAULT_SONNET_MODEL: glm-5.2[1m]
      ANTHROPIC_DEFAULT_OPUS_MODEL: glm-5.2[1m]
      # 1M-context generations are slow; raise the per-request timeout.
      API_TIMEOUT_MS: "3000000"
      # Stop upgrade-check/telemetry pings to api.anthropic.com.
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    listcmd: |
      curl -s https://api.z.ai/api/anthropic/v1/models \
        -H "Authorization: Bearer $(cat ~/.secrets/z.ai)" \
        -H "anthropic-version: 2023-06-01" \
      | jq -r '.data[].id' 2>/dev/null \
      | awk '{ print } /^glm-5\.[23]$/ { print $0 "[1m]" }'

  huggingface:
    # Hugging Face Inference Providers — an Anthropic-compatible router in front
    # of ~100 open models across many inference backends.
    # https://huggingface.co/docs/inference-providers/integrations/claude-code
    #
    # Token needs the "Make calls to Inference Providers" permission:
    #   https://huggingface.co/settings/tokens/new?ownUserPermissions=inference.serverless.write&tokenType=fineGrained
    # Store it like every other provider here:
    #   printf '%s' hf_xxx > ~/.secrets/huggingface && chmod 600 ~/.secrets/huggingface
    base_url: https://router.huggingface.co
    auth_token: ~/.secrets/huggingface
    # HF's docs export ANTHROPIC_API_KEY as well as ANTHROPIC_AUTH_TOKEN.
    api_key: auth_token
    max_output_tokens:
    # No single model is the natural default here, so aim claude code's opus/
    # sonnet/haiku/subagent slots at whatever you picked rather than hardcoding.
    route_slots_to_model: true
    # env:
    #   # Bill inference to an org you belong to (Team/Enterprise only).
    #   ANTHROPIC_CUSTOM_HEADERS: "X-HF-Bill-To: your-org-name"
    #
    # Model id format is owner/Model with an optional routing suffix:
    #   owner/Model                 default :fastest policy (highest throughput,
    #                               automatic failover)
    #   owner/Model:cheapest        cheapest live provider
    #   owner/Model:fireworks-ai    pinned provider, deterministic routing
    # The catalogue is unauthenticated, so the picker works before you have a
    # token. Only tool-capable live providers are listed — claude code is
    # useless against a model that cannot call tools.
    # [1m] variants (see the ollama note above) are emitted per pinned provider
    # that reports >=1M context, and on the bare id only when *every* live
    # provider clears 1M — otherwise dynamic routing could land you on a
    # smaller context than the suffix claims.
    listcmd: |
      curl -s https://router.huggingface.co/v1/models \
      | jq -r '
          .data[]
          | .id as $id
          | [.providers[] | select(.status == "live" and .supports_tools)] as $ps
          | select($ps | length > 0)
          | (
              [$id]
              + (if ($ps | all(.context_length != null and .context_length >= 1000000))
                 then [$id + "[1m]"] else [] end)
              + [$id + ":cheapest"]
              + ($ps | map($id + ":" + .provider))
              + ($ps | map(select(.context_length != null and .context_length >= 1000000)
                           | $id + ":" + .provider + "[1m]"))
            )[]
        ' 2>/dev/null

  xai:
    # xAI (Grok) — exposes an Anthropic-compatible /v1/messages alongside its
    # OpenAI-style routes, so claude code talks to it directly.
    # https://docs.x.ai/docs/api-reference   (key from https://console.x.ai)
    #
    # BILLING: an API key meters against pay-as-you-go API credits. A SuperGrok
    # or X Premium+ subscription is a *consumer* entitlement on the
    # accounts.x.ai OAuth surface — claude code has no xAI OAuth flow and can
    # only present a bearer token, so the subscription does not pay for this.
    # Confirmed against the live API: a valid key with no credits authenticates
    # but every call (including /v1/models) returns
    #   403 permission-denied "team doesn't have any credits or licenses yet"
    # so the model picker stays empty until credits are bought at console.x.ai.
    # A wrong key gives "Incorrect API key" instead — the two are easy to tell
    # apart when debugging.
    #
    # Auth: verified against the live endpoint — both `Authorization: Bearer`
    # and `x-api-key` are accepted, so ANTHROPIC_AUTH_TOKEN alone is enough and
    # no api_key entry is needed here.
    base_url: https://api.x.ai
    auth_token: ~/.secrets/xai
    max_output_tokens:
    # Point claude code's opus/sonnet/haiku/subagent slots at the picked model;
    # the Anthropic names they default to don't exist here.
    route_slots_to_model: true
    # No [1m] variants: unlike ollama/z.ai there is no confirmed 1M-context
    # Grok model, and the suffix would claim a window the backend may not have.
    # /v1/models needs the key, so the picker is empty without it — apply_env
    # already fails loudly ("token file not found") before we get that far.
    listcmd: |
      curl -s https://api.x.ai/v1/models \
        -H "Authorization: Bearer $(cat ~/.secrets/xai)" \
      | jq -r '.data[].id' 2>/dev/null | sort

